spring.application.name=sri-facturacion-api
server.port=8090

# Lectura nativa del archivo .env
spring.config.import=optional:file:.env[.properties]

# Configuración PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dbfacturacion}
spring.datasource.username=${DB_USER:root_cerbero}
spring.datasource.password=${DB_PASS:password_seguro}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate 7 / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Credenciales de bootstrap para el primer arranque
app.admin.username=${APP_ADMIN_USER:admin}
app.admin.password=${APP_ADMIN_PASS:AdminTemporal2026*}

# Web Services SOAP SRI - Ambiente Pruebas (Código 1)
sri.ws.pruebas.recepcion=https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
sri.ws.pruebas.autorizacion=https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline
sri.ws.pruebas.consulta=https://celcer.sri.gob.ec/comprobantes-electronicos-ws/ConsultaComprobante

# Web Services SOAP SRI - Ambiente Producción (Código 2)
sri.ws.produccion.recepcion=https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline
sri.ws.produccion.autorizacion=https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline
sri.ws.produccion.consulta=https://cel.sri.gob.ec/comprobantes-electronicos-ws/ConsultaComprobante